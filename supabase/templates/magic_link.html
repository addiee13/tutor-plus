<h2>Your Tutor Plus sign-in code</h2>
<p>Enter this code on the Tutor Plus sign-in page:</p>
<p style="font-size:24px;letter-spacing:4px"><strong>{{ .Token }}</strong></p>
<p>Or follow this link to sign in: <a href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&type=email">Sign in to Tutor Plus</a></p>
<p>The code and link expire in one hour and work once. If you did not ask to sign in, you can ignore this email.</p>
